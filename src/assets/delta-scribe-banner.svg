<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="badge-clip">
      <rect x="0" y="0" width="44" height="20" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="150" fill="url(#bg)" rx="0"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="30" x2="400" y2="30"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="150"/>
    <line x1="300" y1="0" x2="300" y2="150"/>
  </g>

  <!-- Waveform motif — background, wider, more subtle -->
  <g filter="url(#glow)" opacity="0.55">
    <!-- Wave 1 — top -->
    <path d="M 30 75 L 45 75 L 50 55 L 55 95 L 60 65 L 65 85 L 70 75 L 85 75 L 90 40 L 95 110 L 100 60 L 105 90 L 110 75 L 125 75 L 130 50 L 135 100 L 140 70 L 145 80 L 150 75" 
          fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <!-- Wave 2 — main -->
    <path d="M 155 75 L 165 75 L 170 45 L 175 105 L 180 60 L 185 90 L 190 75 L 200 75 L 205 55 L 210 95 L 215 65 L 220 85 L 225 75 L 240 75 L 245 35 L 250 115 L 255 50 L 260 100 L 265 75 L 280 75 L 285 50 L 290 100 L 295 60 L 300 90 L 305 75 L 320 75 L 325 55 L 330 95 L 335 70 L 340 80 L 345 75 L 370 75" 
          fill="none" stroke="url(#wave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wave 3 — bottom offset -->
    <path d="M 30 85 L 40 85 L 45 70 L 50 100 L 55 75 L 60 95 L 65 85 L 75 85 L 80 55 L 85 105 L 90 80 L 95 90 L 100 85" 
          fill="none" stroke="#4F46E5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  </g>

  <!-- Sync indicator dots along waveform center -->
  <g opacity="0.6">
    <circle cx="200" cy="75" r="2.5" fill="#6366F1"/>
    <circle cx="210" cy="95" r="2" fill="#6366F1" opacity="0.7"/>
    <circle cx="225" cy="75" r="2.5" fill="#6366F1"/>
    <circle cx="245" cy="35" r="2" fill="#6366F1" opacity="0.7"/>
    <circle cx="265" cy="75" r="2.5" fill="#6366F1"/>
    <circle cx="285" cy="50" r="2" fill="#6366F1" opacity="0.7"/>
    <circle cx="305" cy="75" r="2.5" fill="#6366F1"/>
  </g>

  <!-- Brand text -->
  <g transform="translate(24, 62)">
    <!-- DeltaScribe -->
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="-0.01em">
      DeltaScribe
    </text>
    <!-- Studio -->
    <text x="118" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#a5a5c0" letter-spacing="0.02em">
      Studio
    </text>
    
    <!-- Tagline -->
    <text x="0" y="22" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#6366F1" letter-spacing="0.06em">
      PRIVACY-FIRST
    </text>
    <text x="92" y="22" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" letter-spacing="0.02em">
      SUBTITLE SYNC
    </text>
  </g>

  <!-- Right-side badge: client-side indicator -->
  <g transform="translate(300, 50)">
    <rect width="80" height="20" rx="4" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="40" y="13.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="500" fill="#6366F1" letter-spacing="0.06em">
      CLIENT-SIDE
    </text>
  </g>

  <!-- Small icon motif — subtitle lines with sync marks -->
  <g transform="translate(300, 80)" opacity="0.5">
    <rect x="0" y="0" width="28" height="3" rx="1.5" fill="#6366F1" opacity="0.6"/>
    <rect x="6" y="7" width="22" height="3" rx="1.5" fill="#6366F1" opacity="0.4"/>
    <rect x="2" y="14" width="26" height="3" rx="1.5" fill="#6366F1" opacity="0.3"/>
    <!-- Sync indicator -->
    <circle cx="0" cy="1.5" r="2" fill="#6366F1" opacity="0.8"/>
    <circle cx="6" cy="8.5" r="2" fill="#6366F1" opacity="0.6"/>
    <circle cx="2" cy="15.5" r="2" fill="#6366F1" opacity="0.4"/>
  </g>
</svg>
